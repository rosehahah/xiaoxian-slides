name: Check 小苋演示
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: npm run build
      - name: Verify PDF and PowerPoint export
        run: node skills/xiaoxian-slides/scripts/export.mjs examples/demo.html --out-dir output
      - uses: actions/upload-artifact@v4
        with:
          name: xiaoxian-demo
          path: |
            examples/demo.html
            output/*.pdf
            output/*.pptx
